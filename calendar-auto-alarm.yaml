blueprint:
  name: Advanced Android Alarms from Calendar
  description: Sets multiple configurable alarms on your Android device by reading the next morning's calendar events.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/gorlix/Home-Assistant-Calendar-Alarm/blob/main/calendar-auto-alarm.yaml
  input:
    orario_esecuzione:
      name: Run time
      description: Evening time when the automation runs. Keep it before midnight.
      default: "23:00:00"
      selector:
        time: {}

    calendario:
      name: Calendar
      description: Calendar entity to scan.
      selector:
        entity:
          filter:
            - domain: calendar

    dispositivo_android:
      name: Android notify service
      description: Notify service of your Android phone, e.g. notify.mobile_app_your_phone
      selector:
        text:
          multiline: false

    # Group 1 settings
    g1_titolo:
      name: Event title (Group 1)
      default: "Alarm 1"
      selector:
        text:
          multiline: false

    g1_num:
      name: Number of alarms (Group 1)
      default: 4
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: slider

    g1_intervallo:
      name: Minutes between alarms (Group 1)
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min
          mode: slider

    g1_label:
      name: Alarm label on the phone (Group 1)
      default: "Home Assistant"
      selector:
        text:
          multiline: false

    # Group 2 settings
    g2_titolo:
      name: Event title (Group 2)
      default: "Alarm 2"
      selector:
        text:
          multiline: false

    g2_num:
      name: Number of alarms (Group 2)
      default: 3
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: slider

    g2_intervallo:
      name: Minutes between alarms (Group 2)
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min
          mode: slider

    g2_label:
      name: Alarm label on the phone (Group 2)
      default: "Emergency"
      selector:
        text:
          multiline: false

mode: single

triggers:
  - trigger: time
    at: !input orario_esecuzione

actions:
  - variables:
      cal_entity: !input calendario
      g1_title: !input g1_titolo
      g1_count: !input g1_num
      g1_interval: !input g1_intervallo
      g1_label: !input g1_label
      g2_title: !input g2_titolo
      g2_count: !input g2_num
      g2_interval: !input g2_intervallo
      g2_label: !input g2_label

  - action: calendar.get_events
    target:
      entity_id: "{{ cal_entity }}"
    data:
      start_date_time: "{{ today_at('00:00') + timedelta(days=1) }}"
      end_date_time: "{{ today_at('12:00') + timedelta(days=1) }}"
    response_variable: tomorrow_events

  - variables:
      g1_start_str: >
        {% set ns = namespace(start=none) %}
        {% for ev in tomorrow_events[cal_entity].events %}
          {% if ev.summary == g1_title and ns.start == none %}
            {% set ns.start = ev.start %}
          {% endif %}
        {% endfor %}
        {{ ns.start }}
      g2_start_str: >
        {% set ns = namespace(start=none) %}
        {% for ev in tomorrow_events[cal_entity].events %}
          {% if ev.summary == g2_title and ns.start == none %}
            {% set ns.start = ev.start %}
          {% endif %}
        {% endfor %}
        {{ ns.start }}

  - condition: template
    value_template: >-
      {{ g1_start_str not in ['None', '', none] or g2_start_str not in ['None', '', none] }}

  - alias: Group 1 alarms
    if:
      - condition: template
        value_template: "{{ g1_start_str not in ['None', '', none] }}"
    then:
      - repeat:
          count: "{{ g1_count | int }}"
          sequence:
            - action: !input dispositivo_android
              data:
                message: command_activity
                data:
                  intent_action: android.intent.action.SET_ALARM
                  # Computed inline: datetimes stored in variables become strings
                  intent_extras: >-
                    {% set offset_min = (g1_count | int - repeat.index) * (g1_interval | int) %}
                    {% set alarm_time = as_datetime(g1_start_str).astimezone() - timedelta(minutes=offset_min) %}
                    android.intent.extra.alarm.HOUR:{{ alarm_time.hour }},android.intent.extra.alarm.MINUTES:{{ alarm_time.minute }},android.intent.extra.alarm.SKIP_UI:true,android.intent.extra.alarm.MESSAGE:{{ g1_label }}
            - delay:
                seconds: 2

  - alias: Group 2 alarms
    if:
      - condition: template
        value_template: "{{ g2_start_str not in ['None', '', none] }}"
    then:
      - repeat:
          count: "{{ g2_count | int }}"
          sequence:
            - action: !input dispositivo_android
              data:
                message: command_activity
                data:
                  intent_action: android.intent.action.SET_ALARM
                  # Computed inline: datetimes stored in variables become strings
                  intent_extras: >-
                    {% set offset_min = (g2_count | int - repeat.index) * (g2_interval | int) %}
                    {% set alarm_time = as_datetime(g2_start_str).astimezone() - timedelta(minutes=offset_min) %}
                    android.intent.extra.alarm.HOUR:{{ alarm_time.hour }},android.intent.extra.alarm.MINUTES:{{ alarm_time.minute }},android.intent.extra.alarm.SKIP_UI:true,android.intent.extra.alarm.MESSAGE:{{ g2_label }}
            - delay:
                seconds: 2

  - action: !input dispositivo_android
    metadata: {}
    data:
      message: Your alarms for tomorrow morning have been set.
      title: Alarms Set
