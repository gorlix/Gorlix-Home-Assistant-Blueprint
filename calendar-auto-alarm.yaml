blueprint:
  name: Advanced Android Alarms from Calendar
  description: |
    ## Advanced Android Alarms from Calendar

    **Version 1.4** | [GitHub](https://github.com/gorlix/Gorlix-Home-Assistant-Blueprint) | [Report an issue](https://github.com/gorlix/Gorlix-Home-Assistant-Blueprint/issues)

    Every evening this automation reads tomorrow morning's calendar events and sets
    real alarms in your Android phone's clock app. Nothing opens on the phone and the
    screen stays off. Anything that can write to a calendar (an AI assistant, a bot,
    a shared family calendar) can now set your alarms.

    ### Features
    - Alarms set silently in the background (`SKIP_UI`).
    - Several staggered alarms per event, e.g. 4 alarms 10 minutes apart.
    - Two independent groups, each with its own event title, count, interval and label.
    - Optional confirmation notification with custom title, text, link and Android options.
    - Alarm commands sent with high priority, so a sleeping phone gets them right away.
    - Sync: moved or deleted events update the alarms on the phone (needs a Text helper).
    - Run it on demand from a webhook, a Home Assistant event or a periodic check.

    ### Requirements
    - Android phone with the [Home Assistant Companion app](https://companion.home-assistant.io/).
    - **Alarms & reminders** permission granted to the app
      (Android Settings → Apps → Home Assistant → Alarms & reminders).
    - Any calendar integration: Local Calendar, Google Calendar, CalDAV, ...

    <details>
    <summary>How it works</summary>

    1. At the run time, the automation reads events from **00:00 to 12:00 of the next
       morning**: today before 12:00, tomorrow after 12:00. A webhook or event can force
       the day with `day: today` or `day: tomorrow`.
    2. For each group it takes the **first** event whose title matches exactly.
    3. It counts backwards from the event start. With 4 alarms 10 minutes apart and an
       event at 07:00 you get 06:30, 06:40, 06:50 and 07:00.
    4. Each alarm is sent to the phone as an `android.intent.action.SET_ALARM` intent.
    5. If no event matches, nothing happens. No event, no alarm.
    6. With the sync helper set, the automation remembers the alarms it set. On the next
       run, if an event moved or disappeared, it removes the old alarms with
       `android.intent.action.DISMISS_ALARM` (searched by exact time) and sets the new ones.
       If nothing changed, nothing is sent.
    7. Before reading, the calendar is refreshed, so a sync started right after an edit
       sees the new event.

    </details>

    <details>
    <summary>Good to know</summary>

    - Title matching is **exact and case-sensitive**: `Alarm 1` and `alarm 1` are different.
    - Without the sync helper, alarms are only added: moving or deleting the event
      afterwards does not change the alarms already on the phone.
    - Home Assistant has no trigger for *event changed*: to react to calendar edits,
      call the webhook after editing or turn on the periodic check.
    - Google Clock deletes removed alarms. Other clock apps may only switch them off,
      or open for a moment while removing.
    - Alarms are removed by time. If another enabled alarm rings at the same minute
      (one of yours, or the other group), the clock app asks which one to remove.
    - Removing works only for alarms less than 24 hours away and with Google Clock or
      another app supporting `DISMISS_ALARM`. Test it once on your phone.
    - Android only: iOS does not let apps create alarms in the Clock app.

    </details>

    <details>
    <summary>Troubleshooting</summary>

    - **The run lasts a fraction of a second and no alarm is set**: no event matched.
      Open the trace, step *Get the morning's events*, and compare the event
      titles with the ones set in Group 1 and Group 2.
    - **Notifications arrive but no alarm appears**: check the *Alarms & reminders*
      permission of the Companion app.
    - **Duplicate alarms**: another automation is setting alarms from the same calendar.
    - **Old alarms not removed**: check that the sync helper is set and that its value
      changes after a run. Alarms set before turning sync on are not tracked and are
      not removed.
    - **Webhook does nothing**: with *local network only* on, calls through Nabu Casa or
      a public URL are refused.

    </details>

    <details>
    <summary>Changelog</summary>

    - **1.4**: Sync helper: moved or deleted events remove or update the alarms. Webhook,
      Home Assistant event and periodic check triggers. Next morning picked from the time
      of the run. Alarms already in the past are skipped. Calendar refreshed before reading.
    - **1.3**: Android options for the confirmation notification (channel, importance,
      icon, auto-dismiss, ...) and link on tap. Alarm commands sent with high priority.
    - **1.2**: Pick the phone from your devices. The notify service is now optional.
    - **1.1**: English input keys, input sections, configurable confirmation
      notification, fixed alarm time calculation, readable traces.
    - **1.0**: First release.

    </details>
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/gorlix/Gorlix-Home-Assistant-Blueprint/blob/main/calendar-auto-alarm.yaml
  input:
    run_time:
      name: Run time
      description: >-
        Evening time when the automation checks the next morning's calendar.
        After 12:00 it reads tomorrow, before 12:00 it reads today.
      default: "23:00:00"
      selector:
        time: {}

    calendar:
      name: Calendar
      description: Calendar that holds your wake-up events. Only events between 00:00 and 12:00 of the next morning are read.
      selector:
        entity:
          filter:
            - domain: calendar

    notify_device:
      name: Android phone
      description: Phone running the Home Assistant Companion app, where the alarms are set.
      default: ""
      selector:
        device:
          filter:
            - integration: mobile_app

    notify_service:
      name: Notify service (optional)
      description: >-
        Leave empty to use the phone's default service. Set it only if your
        service name differs from the device name, e.g. `notify.mobile_app_my_phone`.
        You can find it in Developer Tools → Actions by typing `notify.mobile_app`.
      default: ""
      selector:
        text:
          multiline: false

    group_1:
      name: Group 1
      icon: mdi:alarm
      description: Alarms for your normal wake-up event.
      input:
        g1_event_title:
          name: Event title
          description: >-
            Exact title of the calendar event that triggers this group.
            Matching is case-sensitive and includes emoji.
          default: "Alarm 1"
          selector:
            text:
              multiline: false

        g1_alarm_count:
          name: Number of alarms
          description: How many alarms to set. The last one rings at the event start time.
          default: 4
          selector:
            number:
              min: 1
              max: 10
              step: 1
              mode: slider

        g1_alarm_interval:
          name: Minutes between alarms
          description: Gap between two alarms. With 3 alarms 10 minutes apart and an event at 07:00 you get 06:40, 06:50 and 07:00.
          default: 10
          selector:
            number:
              min: 1
              max: 60
              step: 1
              unit_of_measurement: min
              mode: slider

        g1_alarm_label:
          name: Alarm label on the phone
          description: Name shown on the alarm in the clock app.
          default: "Alarm 1"
          selector:
            text:
              multiline: false

    group_2:
      name: Group 2
      icon: mdi:alarm-multiple
      description: A second, independent set of alarms, e.g. for mornings you really can't miss.
      input:
        g2_event_title:
          name: Event title
          description: >-
            Exact title of the calendar event that triggers this group.
            Matching is case-sensitive and includes emoji.
          default: "Alarm 2"
          selector:
            text:
              multiline: false

        g2_alarm_count:
          name: Number of alarms
          description: How many alarms to set. The last one rings at the event start time.
          default: 3
          selector:
            number:
              min: 1
              max: 10
              step: 1
              mode: slider

        g2_alarm_interval:
          name: Minutes between alarms
          description: Gap between two alarms. With 3 alarms 10 minutes apart and an event at 07:00 you get 06:40, 06:50 and 07:00.
          default: 10
          selector:
            number:
              min: 1
              max: 60
              step: 1
              unit_of_measurement: min
              mode: slider

        g2_alarm_label:
          name: Alarm label on the phone
          description: Name shown on the alarm in the clock app.
          default: "Alarm 2"
          selector:
            text:
              multiline: false

    confirmation:
      name: Confirmation notification
      icon: mdi:bell-check
      description: A normal notification sent after the alarms are set, so you know before sleeping that everything is in place.
      collapsed: true
      input:
        confirmation_enabled:
          name: Send confirmation
          description: Send a notification to the phone after the alarms are set.
          default: true
          selector:
            boolean: {}

        confirmation_title:
          name: Notification title
          default: "Alarms Set"
          selector:
            text:
              multiline: false

        confirmation_message:
          name: Notification message
          default: "Your alarms for tomorrow morning have been set."
          selector:
            text:
              multiline: true

        confirmation_link:
          name: Link on tap
          description: >-
            Opened when the notification is tapped, e.g. `/lovelace/home`,
            `entityId:calendar.my_calendar` or `app://com.google.android.deskclock`.
            Leave empty to open the Companion app.
          default: ""
          selector:
            text:

    android_options:
      name: Android notification options
      icon: mdi:android
      description: >-
        How the confirmation notification is delivered and shown on Android.
        The defaults work for most cases.
      collapsed: true
      input:
        channel:
          name: Channel
          description: >-
            Notification channel, shown in Android Settings → Apps → Home Assistant →
            Notifications. Android fixes a channel's sound and importance the first
            time it is used: to change them later, use a new channel name or edit
            the channel in Android settings.
          default: "Alarms"
          selector:
            text:
        importance:
          name: Importance
          description: Applied only when the channel is created.
          default: low
          selector:
            select:
              options:
                - label: High, sound and pop-up
                  value: high
                - label: Default, sound
                  value: default
                - label: Low, silent
                  value: low
                - label: Min, silent and hidden from status bar
                  value: min
        high_priority:
          name: Deliver immediately
          description: >-
            Send with high priority and no time-to-live, so a phone in Doze mode
            gets it right away.
          default: true
          selector:
            boolean: {}
        visibility:
          name: Lock screen visibility
          default: private
          selector:
            select:
              options:
                - label: Public, always show content
                  value: public
                - label: Private, follow phone settings
                  value: private
                - label: Secret, hide on lock screen
                  value: secret
        android_icon:
          name: Status bar icon
          default: "mdi:alarm-check"
          selector:
            icon: {}
        android_color:
          name: Icon color
          description: Leave empty for the default color.
          default: []
          selector:
            color_rgb: {}
        auto_dismiss:
          name: Remove after
          description: Remove the notification automatically after this time. 0 keeps it.
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration: {}
        sticky:
          name: Keep after tap
          description: Keep the notification when it is tapped.
          default: false
          selector:
            boolean: {}
        alert_once:
          name: Alert once
          description: Do not play a sound again when a notification with the same tag is replaced.
          default: true
          selector:
            boolean: {}
        vibration_pattern:
          name: Vibration pattern
          description: >-
            Comma-separated milliseconds, alternating pause and vibration,
            e.g. `100, 300, 100, 300`. Applied only when the channel is created.
            Leave empty for the default.
          default: ""
          selector:
            text:
        tag:
          name: Tag
          description: >-
            A new notification with the same tag replaces the previous one, so
            you never see more than one confirmation.
          default: "calendar_alarms"
          selector:
            text:
        group:
          name: Group
          description: Notifications with the same group are stacked together.
          default: ""
          selector:
            text:
        car_ui:
          name: Show on Android Auto
          default: false
          selector:
            boolean: {}

    sync:
      name: Sync and triggers
      icon: mdi:sync
      description: >-
        Run the automation again when the calendar changes, so moved or deleted
        events update the alarms on the phone. Removing alarms needs the sync helper.
      collapsed: true
      input:
        state_helper:
          name: Sync helper
          description: >-
            A Text helper (`input_text`, max length 255) where the automation remembers
            which alarms it set. With it, each run only changes what is different from
            the last run: alarms of a moved or deleted event are removed from the phone
            with `DISMISS_ALARM`, searched by their time. Leave empty to only add alarms,
            as in version 1.3.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_text

        webhook_id:
          name: Webhook ID
          description: >-
            Run the automation by calling `/api/webhook/<ID>` (POST or PUT), e.g. from
            the AI assistant or bot that edits your calendar. Use a long random string:
            anyone who knows it can start a sync. Leave empty to disable the webhook.
            Optional JSON body or query parameter: `day` = `today`, `tomorrow` or `auto`.
          default: ""
          selector:
            text:

        webhook_local_only:
          name: Webhook from local network only
          description: Accept webhook calls only from your home network. Turn off to call it through Nabu Casa or a public URL.
          default: true
          selector:
            boolean: {}

        sync_event:
          name: Home Assistant event
          description: >-
            Event type that runs the automation, e.g. from a script with the
            *Fire event* action. Optional event data: `day` = `today`, `tomorrow` or `auto`.
          default: "calendar_alarm_sync"
          selector:
            text:

        periodic_enabled:
          name: Periodic check
          description: >-
            Check the calendar again at a fixed interval, from the run time until 12:00.
            Works only with the sync helper set.
          default: false
          selector:
            boolean: {}

        periodic_interval:
          name: Check every
          default: "/15"
          selector:
            select:
              options:
                - label: 10 minutes
                  value: "/10"
                - label: 15 minutes
                  value: "/15"
                - label: 30 minutes
                  value: "/30"
                - label: 1 hour
                  value: "0"

        removed_title:
          name: Removal notification title
          description: Sent instead of the confirmation when alarms were only removed. Uses the confirmation and Android options above.
          default: "Alarms Removed"
          selector:
            text:
              multiline: false

        removed_message:
          name: Removal notification message
          default: "The calendar event is gone, so its alarms were removed."
          selector:
            text:
              multiline: true

# Queued so a webhook arriving during a run is handled right after it
mode: queued
max: 5

triggers:
  - trigger: time
    id: scheduled
    at: !input run_time
  - trigger: webhook
    id: webhook
    webhook_id: !input webhook_id
    local_only: !input webhook_local_only
    allowed_methods:
      - POST
      - PUT
  - trigger: event
    id: event
    event_type: !input sync_event
  - trigger: time_pattern
    id: periodic
    enabled: !input periodic_enabled
    minutes: !input periodic_interval

actions:
  - alias: Load inputs
    variables:
      cal_entity: !input calendar
      g1_title: !input g1_event_title
      g1_count: !input g1_alarm_count
      g1_interval: !input g1_alarm_interval
      g1_label: !input g1_alarm_label
      g2_title: !input g2_event_title
      g2_count: !input g2_alarm_count
      g2_interval: !input g2_alarm_interval
      g2_label: !input g2_alarm_label
      confirmation_enabled: !input confirmation_enabled
      confirmation_link: !input confirmation_link
      channel: !input channel
      importance: !input importance
      high_priority: !input high_priority
      visibility: !input visibility
      android_icon: !input android_icon
      android_color: !input android_color
      auto_dismiss: !input auto_dismiss
      sticky: !input sticky
      alert_once: !input alert_once
      vibration_pattern: !input vibration_pattern
      tag: !input tag
      group: !input group
      car_ui: !input car_ui
      state_helper: !input state_helper
      sync_enabled: "{{ state_helper | length > 0 }}"
      input_device: !input notify_device
      input_service: !input notify_service
      notify_service: >-
        {% if input_service | trim %}
          {{ input_service | trim }}
        {% elif input_device %}
          notify.mobile_app_{{ device_attr(input_device, 'name') | slugify }}
        {% endif %}

  - alias: Stop if no phone is set
    if:
      - alias: No phone or notify service
        condition: template
        value_template: "{{ not notify_service }}"
    then:
      - stop: Set the Android phone or the notify service in the blueprint settings.
        error: true

  - alias: Skip periodic checks outside the alarm window
    if:
      - alias: Started by the periodic check
        condition: trigger
        id: periodic
      - condition: or
        conditions:
          - alias: No sync helper
            condition: template
            value_template: "{{ not sync_enabled }}"
          - alias: Outside run time to 12:00
            condition: not
            conditions:
              - condition: time
                after: !input run_time
                before: "12:00:00"
    then:
      - stop: Periodic checks run only with the sync helper set, from the run time until 12:00.

  - alias: Pick the morning to read
    variables:
      # Webhook JSON body or query, or event data, may force the day
      requested_day: >-
        {% set ns = namespace(day='') %}
        {% if trigger.id == 'webhook' %}
          {% if trigger.json is defined and trigger.json is mapping %}
            {% set ns.day = trigger.json.get('day', '') %}
          {% endif %}
          {% if not ns.day and trigger.query is defined %}
            {% set ns.day = trigger.query.get('day', '') %}
          {% endif %}
        {% elif trigger.id == 'event' %}
          {% set ns.day = trigger.event.data.get('day', '') %}
        {% endif %}
        {{ ns.day | string | lower | trim }}
      # Before 12:00 the next morning is today, after 12:00 it is tomorrow
      day_offset: >-
        {% if requested_day == 'today' %}0
        {% elif requested_day == 'tomorrow' %}1
        {% else %}{{ 0 if now().hour < 12 else 1 }}
        {% endif %}

  # Cloud calendars refresh every few minutes: without this, a sync started right
  # after editing the calendar could still read the old event
  - alias: Refresh the calendar
    action: homeassistant.update_entity
    target:
      entity_id: "{{ cal_entity }}"
    continue_on_error: true

  - alias: Get the morning's events
    action: calendar.get_events
    target:
      entity_id: "{{ cal_entity }}"
    data:
      start_date_time: "{{ today_at('00:00') + timedelta(days=day_offset | int) }}"
      end_date_time: "{{ today_at('12:00') + timedelta(days=day_offset | int) }}"
    response_variable: morning_events

  - alias: Plan the alarm changes
    variables:
      groups:
        - key: g1
          title: "{{ g1_title }}"
          count: "{{ g1_count | int }}"
          interval: "{{ g1_interval | int }}"
          label: "{{ g1_label }}"
        - key: g2
          title: "{{ g2_title }}"
          count: "{{ g2_count | int }}"
          interval: "{{ g2_interval | int }}"
          label: "{{ g2_label }}"
      # Start of the first event whose title matches, empty if none
      starts: >-
        {% set ev = morning_events[cal_entity].events %}
        {% set m1 = ev | selectattr('summary', 'eq', g1_title) | map(attribute='start') | list %}
        {% set m2 = ev | selectattr('summary', 'eq', g2_title) | map(attribute='start') | list %}
        {{ {'g1': m1[0] if m1 else '', 'g2': m2[0] if m2 else ''} }}
      # Helper format: g1 start|g1 count|g2 start|g2 count
      stored_state: "{{ states(state_helper) if sync_enabled else '' }}"
      stored: >-
        {% set p = stored_state.split('|') %}
        {% if p | count == 4 %}
          {{ {'g1': {'start': p[0], 'count': p[1] | int(0)}, 'g2': {'start': p[2], 'count': p[3] | int(0)}} }}
        {% else %}
          {{ {'g1': {'start': '', 'count': 0}, 'g2': {'start': '', 'count': 0}} }}
        {% endif %}
      new_state: >-
        {{ starts.g1 }}|{{ g1_count | int if starts.g1 else 0 }}|{{ starts.g2 }}|{{ g2_count | int if starts.g2 else 0 }}
      # Without the helper every run sets the alarms again (the clock app ignores
      # duplicates). With it, a group changes only when its event moved, appeared or
      # disappeared: old alarms that are no longer needed are removed first, then the
      # missing ones are set. Alarms already in the past are skipped.
      commands: >-
        {% set ns = namespace(dismiss=[], set=[]) %}
        {% for g in groups %}
          {% set new_start = starts[g.key] %}
          {% set new_count = g.count | int if new_start else 0 %}
          {% set old = stored[g.key] %}
          {% if not sync_enabled or new_start != old.start or new_count != old.count %}
            {% set gs = namespace(old=[], new=[]) %}
            {% if sync_enabled and old.start %}
              {% for i in range(1, old.count + 1) %}
                {% set t = as_datetime(old.start).astimezone() - timedelta(minutes=(old.count - i) * (g.interval | int)) %}
                {% if t > now() %}
                  {% set gs.old = gs.old + [{'type': 'dismiss', 'hour': t.hour, 'minute': t.minute,
                       'label': g.label, 'at': t.strftime('%H:%M')}] %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {% for i in range(1, new_count + 1) %}
              {% set t = as_datetime(new_start).astimezone() - timedelta(minutes=(new_count - i) * (g.interval | int)) %}
              {% if t > now() %}
                {% set gs.new = gs.new + [{'type': 'set', 'hour': t.hour, 'minute': t.minute,
                     'label': g.label, 'at': t.strftime('%H:%M')}] %}
              {% endif %}
            {% endfor %}
            {% set old_times = gs.old | map(attribute='at') | list %}
            {% set new_times = gs.new | map(attribute='at') | list %}
            {% set ns.dismiss = ns.dismiss + (gs.old | rejectattr('at', 'in', new_times) | list) %}
            {% set ns.set = ns.set + (gs.new | rejectattr('at', 'in', old_times) | list) %}
          {% endif %}
        {% endfor %}
        {{ ns.dismiss + ns.set }}
      set_count: "{{ commands | selectattr('type', 'eq', 'set') | list | count }}"
      dismiss_count: "{{ commands | selectattr('type', 'eq', 'dismiss') | list | count }}"

  - alias: Send the alarm commands
    repeat:
      for_each: "{{ commands }}"
      sequence:
        - alias: Send SET_ALARM or DISMISS_ALARM intent
          action: "{{ notify_service }}"
          data:
            message: command_activity
            data:
              # High priority and no TTL so a sleeping phone gets the command right away
              priority: high
              ttl: 0
              intent_action: >-
                android.intent.action.{{ 'SET_ALARM' if repeat.item.type == 'set' else 'DISMISS_ALARM' }}
              # Alarms to remove are searched by exact time: a label search matches
              # every alarm whose label contains it, and the clock app then asks which one
              intent_extras: >-
                {%- if repeat.item.type == 'set' -%}
                android.intent.extra.alarm.HOUR:{{ repeat.item.hour }},android.intent.extra.alarm.MINUTES:{{ repeat.item.minute }},android.intent.extra.alarm.SKIP_UI:true,android.intent.extra.alarm.MESSAGE:{{ repeat.item.label }}
                {%- else -%}
                android.intent.extra.alarm.SEARCH_MODE:android.time,android.intent.extra.alarm.HOUR:{{ repeat.item.hour }},android.intent.extra.alarm.MINUTES:{{ repeat.item.minute }}
                {%- endif -%}
        - alias: Wait before the next command
          delay:
            seconds: 2

  - alias: Remember the alarms set
    if:
      - alias: Sync helper set and alarms changed
        condition: template
        value_template: "{{ sync_enabled and new_state != stored_state }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: "{{ state_helper }}"
        data:
          value: "{{ new_state }}"

  - alias: Confirmation notification
    if:
      - alias: Confirmation enabled and alarms changed
        condition: template
        value_template: "{{ confirmation_enabled and (set_count | int > 0 or dismiss_count | int > 0) }}"
    then:
      - alias: Build confirmation payload
        variables:
          confirmation_payload: >-
            {% set d = {'channel': channel, 'importance': importance, 'visibility': visibility} %}
            {% if high_priority %}{% set d = dict(d, priority='high', ttl=0) %}{% endif %}
            {% if confirmation_link | trim %}{% set d = dict(d, clickAction=confirmation_link | trim) %}{% endif %}
            {% if android_icon %}{% set d = dict(d, notification_icon=android_icon) %}{% endif %}
            {% if android_color | count == 3 %}
              {% set d = dict(d, color='#%02x%02x%02x' | format(android_color[0], android_color[1], android_color[2])) %}
            {% endif %}
            {% set secs = (auto_dismiss.get('hours', 0) | int) * 3600
                        + (auto_dismiss.get('minutes', 0) | int) * 60
                        + (auto_dismiss.get('seconds', 0) | int) %}
            {% if secs > 0 %}{% set d = dict(d, timeout=secs) %}{% endif %}
            {% if sticky %}{% set d = dict(d, sticky='true') %}{% endif %}
            {% if alert_once %}{% set d = dict(d, alert_once=true) %}{% endif %}
            {% if vibration_pattern | trim %}{% set d = dict(d, vibrationPattern=vibration_pattern | trim) %}{% endif %}
            {% if tag | trim %}{% set d = dict(d, tag=tag | trim) %}{% endif %}
            {% if group | trim %}{% set d = dict(d, group=group | trim) %}{% endif %}
            {% if car_ui %}{% set d = dict(d, car_ui=true) %}{% endif %}
            {{ d }}
          set_title: !input confirmation_title
          set_message: !input confirmation_message
          removed_title: !input removed_title
          removed_message: !input removed_message
      - alias: Send confirmation
        action: "{{ notify_service }}"
        data:
          title: "{{ set_title if set_count | int > 0 else removed_title }}"
          message: "{{ set_message if set_count | int > 0 else removed_message }}"
          data: "{{ confirmation_payload }}"
