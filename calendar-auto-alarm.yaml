blueprint:
  name: Advanced Android Alarms from Calendar
  description: |
    ## Advanced Android Alarms from Calendar

    **Version 1.2** | [GitHub](https://github.com/gorlix/Home-Assistant-Calendar-Alarm) | [Report an issue](https://github.com/gorlix/Home-Assistant-Calendar-Alarm/issues)

    Every evening this automation reads tomorrow morning's calendar events and sets
    real alarms in your Android phone's clock app. Nothing opens on the phone and the
    screen stays off. Anything that can write to a calendar (an AI assistant, a bot,
    a shared family calendar) can now set your alarms.

    ### Features
    - Alarms set silently in the background (`SKIP_UI`).
    - Several staggered alarms per event, e.g. 4 alarms 10 minutes apart.
    - Two independent groups, each with its own event title, count, interval and label.
    - Optional confirmation notification with custom title and text.

    ### Requirements
    - Android phone with the [Home Assistant Companion app](https://companion.home-assistant.io/).
    - **Alarms & reminders** permission granted to the app
      (Android Settings → Apps → Home Assistant → Alarms & reminders).
    - Any calendar integration: Local Calendar, Google Calendar, CalDAV, ...

    <details>
    <summary>How it works</summary>

    1. At the run time, the automation reads events from **00:00 to 12:00 of the next day**.
    2. For each group it takes the **first** event whose title matches exactly.
    3. It counts backwards from the event start. With 4 alarms 10 minutes apart and an
       event at 07:00 you get 06:30, 06:40, 06:50 and 07:00.
    4. Each alarm is sent to the phone as an `android.intent.action.SET_ALARM` intent.
    5. If no event matches, nothing happens. No event, no alarm.

    </details>

    <details>
    <summary>Good to know</summary>

    - Title matching is **exact and case-sensitive**: `Alarm 1` and `alarm 1` are different.
    - Alarms are set once. Moving or deleting the event afterwards does not change
      the alarms already on the phone.
    - Keep the run time **before midnight**, since the search always targets tomorrow.
    - Android only: iOS does not let apps create alarms in the Clock app.

    </details>

    <details>
    <summary>Troubleshooting</summary>

    - **The run lasts a fraction of a second and no alarm is set**: no event matched.
      Open the trace, step *Get tomorrow morning's events*, and compare the event
      titles with the ones set in Group 1 and Group 2.
    - **Notifications arrive but no alarm appears**: check the *Alarms & reminders*
      permission of the Companion app.
    - **Duplicate alarms**: another automation is setting alarms from the same calendar.

    </details>

    <details>
    <summary>Changelog</summary>

    - **1.2**: Pick the phone from your devices. The notify service is now optional.
    - **1.1**: English input keys, input sections, configurable confirmation
      notification, fixed alarm time calculation, readable traces.
    - **1.0**: First release.

    </details>
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/gorlix/Home-Assistant-Calendar-Alarm/blob/main/calendar-auto-alarm.yaml
  input:
    run_time:
      name: Run time
      description: >-
        Evening time when the automation checks tomorrow's calendar.
        Keep it before midnight, otherwise it looks at the day after tomorrow.
      default: "23:00:00"
      selector:
        time: {}

    calendar:
      name: Calendar
      description: Calendar that holds your wake-up events. Only events between 00:00 and 12:00 of the next day are read.
      selector:
        entity:
          filter:
            - domain: calendar

    notify_device:
      name: Android phone
      description: Phone running the Home Assistant Companion app, where the alarms are set.
      default: ""
      selector:
        device:
          filter:
            - integration: mobile_app

    notify_service:
      name: Notify service (optional)
      description: >-
        Leave empty to use the phone's default service. Set it only if your
        service name differs from the device name, e.g. `notify.mobile_app_my_phone`.
        You can find it in Developer Tools → Actions by typing `notify.mobile_app`.
      default: ""
      selector:
        text:
          multiline: false

    group_1:
      name: Group 1
      icon: mdi:alarm
      description: Alarms for your normal wake-up event.
      input:
        g1_event_title:
          name: Event title
          description: >-
            Exact title of the calendar event that triggers this group.
            Matching is case-sensitive and includes emoji.
          default: "Alarm 1"
          selector:
            text:
              multiline: false

        g1_alarm_count:
          name: Number of alarms
          description: How many alarms to set. The last one rings at the event start time.
          default: 4
          selector:
            number:
              min: 1
              max: 10
              step: 1
              mode: slider

        g1_alarm_interval:
          name: Minutes between alarms
          description: Gap between two alarms. With 3 alarms 10 minutes apart and an event at 07:00 you get 06:40, 06:50 and 07:00.
          default: 10
          selector:
            number:
              min: 1
              max: 60
              step: 1
              unit_of_measurement: min
              mode: slider

        g1_alarm_label:
          name: Alarm label on the phone
          description: Name shown on the alarm in the clock app.
          default: "Alarm 1"
          selector:
            text:
              multiline: false

    group_2:
      name: Group 2
      icon: mdi:alarm-multiple
      description: A second, independent set of alarms, e.g. for mornings you really can't miss.
      input:
        g2_event_title:
          name: Event title
          description: >-
            Exact title of the calendar event that triggers this group.
            Matching is case-sensitive and includes emoji.
          default: "Alarm 2"
          selector:
            text:
              multiline: false

        g2_alarm_count:
          name: Number of alarms
          description: How many alarms to set. The last one rings at the event start time.
          default: 3
          selector:
            number:
              min: 1
              max: 10
              step: 1
              mode: slider

        g2_alarm_interval:
          name: Minutes between alarms
          description: Gap between two alarms. With 3 alarms 10 minutes apart and an event at 07:00 you get 06:40, 06:50 and 07:00.
          default: 10
          selector:
            number:
              min: 1
              max: 60
              step: 1
              unit_of_measurement: min
              mode: slider

        g2_alarm_label:
          name: Alarm label on the phone
          description: Name shown on the alarm in the clock app.
          default: "Alarm 2"
          selector:
            text:
              multiline: false

    confirmation:
      name: Confirmation notification
      icon: mdi:bell-check
      description: A normal notification sent after the alarms are set, so you know before sleeping that everything is in place.
      collapsed: true
      input:
        confirmation_enabled:
          name: Send confirmation
          description: Send a notification to the phone after the alarms are set.
          default: true
          selector:
            boolean: {}

        confirmation_title:
          name: Notification title
          default: "Alarms Set"
          selector:
            text:
              multiline: false

        confirmation_message:
          name: Notification message
          default: "Your alarms for tomorrow morning have been set."
          selector:
            text:
              multiline: true

mode: single

triggers:
  - trigger: time
    at: !input run_time

actions:
  - alias: Load inputs
    variables:
      cal_entity: !input calendar
      g1_title: !input g1_event_title
      g1_count: !input g1_alarm_count
      g1_interval: !input g1_alarm_interval
      g1_label: !input g1_alarm_label
      g2_title: !input g2_event_title
      g2_count: !input g2_alarm_count
      g2_interval: !input g2_alarm_interval
      g2_label: !input g2_alarm_label
      confirmation_enabled: !input confirmation_enabled
      input_device: !input notify_device
      input_service: !input notify_service
      notify_service: >-
        {% if input_service | trim %}
          {{ input_service | trim }}
        {% elif input_device %}
          notify.mobile_app_{{ device_attr(input_device, 'name') | slugify }}
        {% endif %}

  - alias: Stop if no phone is set
    if:
      - alias: No phone or notify service
        condition: template
        value_template: "{{ not notify_service }}"
    then:
      - stop: Set the Android phone or the notify service in the blueprint settings.
        error: true

  - alias: Get tomorrow morning's events
    action: calendar.get_events
    target:
      entity_id: "{{ cal_entity }}"
    data:
      start_date_time: "{{ today_at('00:00') + timedelta(days=1) }}"
      end_date_time: "{{ today_at('12:00') + timedelta(days=1) }}"
    response_variable: tomorrow_events

  - alias: Find matching events
    variables:
      g1_start_str: >
        {% set ns = namespace(start=none) %}
        {% for ev in tomorrow_events[cal_entity].events %}
          {% if ev.summary == g1_title and ns.start == none %}
            {% set ns.start = ev.start %}
          {% endif %}
        {% endfor %}
        {{ ns.start }}
      g2_start_str: >
        {% set ns = namespace(start=none) %}
        {% for ev in tomorrow_events[cal_entity].events %}
          {% if ev.summary == g2_title and ns.start == none %}
            {% set ns.start = ev.start %}
          {% endif %}
        {% endfor %}
        {{ ns.start }}

  - alias: Stop if no matching event was found
    condition: template
    value_template: >-
      {{ g1_start_str not in ['None', '', none] or g2_start_str not in ['None', '', none] }}

  - alias: Group 1 alarms
    if:
      - alias: Group 1 event found
        condition: template
        value_template: "{{ g1_start_str not in ['None', '', none] }}"
    then:
      - alias: Set Group 1 alarms
        repeat:
          count: "{{ g1_count | int }}"
          sequence:
            - alias: Send SET_ALARM intent
              action: "{{ notify_service }}"
              data:
                message: command_activity
                data:
                  intent_action: android.intent.action.SET_ALARM
                  # Computed inline: datetimes stored in variables become strings
                  intent_extras: >-
                    {% set offset_min = (g1_count | int - repeat.index) * (g1_interval | int) %}
                    {% set alarm_time = as_datetime(g1_start_str).astimezone() - timedelta(minutes=offset_min) %}
                    android.intent.extra.alarm.HOUR:{{ alarm_time.hour }},android.intent.extra.alarm.MINUTES:{{ alarm_time.minute }},android.intent.extra.alarm.SKIP_UI:true,android.intent.extra.alarm.MESSAGE:{{ g1_label }}
            - alias: Wait before the next alarm
              delay:
                seconds: 2

  - alias: Group 2 alarms
    if:
      - alias: Group 2 event found
        condition: template
        value_template: "{{ g2_start_str not in ['None', '', none] }}"
    then:
      - alias: Set Group 2 alarms
        repeat:
          count: "{{ g2_count | int }}"
          sequence:
            - alias: Send SET_ALARM intent
              action: "{{ notify_service }}"
              data:
                message: command_activity
                data:
                  intent_action: android.intent.action.SET_ALARM
                  # Computed inline: datetimes stored in variables become strings
                  intent_extras: >-
                    {% set offset_min = (g2_count | int - repeat.index) * (g2_interval | int) %}
                    {% set alarm_time = as_datetime(g2_start_str).astimezone() - timedelta(minutes=offset_min) %}
                    android.intent.extra.alarm.HOUR:{{ alarm_time.hour }},android.intent.extra.alarm.MINUTES:{{ alarm_time.minute }},android.intent.extra.alarm.SKIP_UI:true,android.intent.extra.alarm.MESSAGE:{{ g2_label }}
            - alias: Wait before the next alarm
              delay:
                seconds: 2

  - alias: Confirmation notification
    if:
      - alias: Confirmation enabled
        condition: template
        value_template: "{{ confirmation_enabled }}"
    then:
      - alias: Send confirmation
        action: "{{ notify_service }}"
        data:
          title: !input confirmation_title
          message: !input confirmation_message
